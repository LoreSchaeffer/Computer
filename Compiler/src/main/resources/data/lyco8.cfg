MEMORY {
    ZP:     start = $0000, size = $0100, type = rw, file = "";
    RAM:    start = $0200, size = $1E00, type = rw, file = "";
    ROM:    start = $8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $00;
}

SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    BSS:      load = RAM, type = rw;
    CODE:     load = ROM, type = ro;
    RODATA:   load = ROM, type = ro;
    BIOS:     load = ROM, type = ro, start = $FE00, optional = yes;
    VECTORS:  load = ROM, type = ro, start = $FFFA, optional = yes;
}